<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Origin A - Lightbox Parent</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101318;
        color: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(53, 141, 255, 0.2), transparent 28rem),
          linear-gradient(135deg, #101318, #171b24);
      }

      main {
        width: min(720px, calc(100vw - 32px));
        display: grid;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #bac4d6;
        line-height: 1.6;
      }

      .controls {
        display: grid;
        gap: 10px;
      }

      label {
        display: grid;
        gap: 8px;
        color: #dce5f7;
        font-size: 14px;
      }

      input {
        width: 100%;
        border: 1px solid #364257;
        border-radius: 8px;
        padding: 12px 14px;
        background: #171d29;
        color: #fff;
        font: inherit;
      }

      button {
        width: fit-content;
        border: 0;
        border-radius: 8px;
        padding: 11px 16px;
        background: #37d184;
        color: #06140d;
        font: 700 15px/1 system-ui;
        cursor: pointer;
      }

      button:hover {
        background: #5be19d;
      }

      pre {
        min-height: 110px;
        margin: 0;
        overflow: auto;
        border: 1px solid #283244;
        border-radius: 8px;
        padding: 12px;
        background: #0b0e14;
        color: #b7ffc8;
        font-size: 13px;
        line-height: 1.45;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        background: rgba(3, 8, 20, 0.78);
      }

      .overlay.is-open {
        display: grid;
      }

      .lightbox {
        width: min(920px, calc(100vw - 48px));
        height: min(520px, calc(100vh - 48px));
        border: 1px solid rgba(87, 215, 255, 0.85);
        border-radius: 8px;
        overflow: hidden;
        background: #07111f;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Origin A: parent lightbox</h1>
      <p>
        This page owns the lightbox. The red close button lives inside the
        cross-origin iframe.
      </p>

      <div class="controls">
        <label>
          iframe origin B
          <input id="iframeOrigin" value="http://localhost:5174" />
        </label>

        <button id="openLightbox" type="button">Open lightbox</button>
      </div>

      <pre id="log"></pre>
    </main>

    <section id="overlay" class="overlay" aria-modal="true" role="dialog">
      <div class="lightbox">
        <iframe id="lightboxIframe" title="Origin B iframe"></iframe>
      </div>
    </section>

    <script>
      const iframeOriginInput = document.querySelector("#iframeOrigin");
      const openButton = document.querySelector("#openLightbox");
      const overlay = document.querySelector("#overlay");
      const iframe = document.querySelector("#lightboxIframe");
      const logOutput = document.querySelector("#log");

      let activeCloseToken = "";

      function log(message) {
        const now = new Date().toLocaleTimeString();
        logOutput.textContent = `[${now}] ${message}\n${logOutput.textContent}`;
      }

      function buildIframeUrl() {
        activeCloseToken = crypto.randomUUID();

        const iframeOrigin = iframeOriginInput.value.replace(/\/$/, "");
        const url = new URL("/index.html", iframeOrigin);
        url.searchParams.set("parentOrigin", window.location.origin);
        url.searchParams.set("closeToken", activeCloseToken);

        return url.toString();
      }

      function openLightbox() {
        iframe.src = buildIframeUrl();
        overlay.classList.add("is-open");
        log(`opened with token ${activeCloseToken}`);
      }

      function closeLightbox() {
        overlay.classList.remove("is-open");
        iframe.removeAttribute("src");
        activeCloseToken = "";
        log("closed by verified iframe message");
      }

      window.addEventListener("message", (event) => {
        const isExpectedFrame = event.source === iframe.contentWindow;
        const isCloseMessage = event.data?.type === "CLOSE_LIGHTBOX";
        const hasValidToken = event.data?.closeToken === activeCloseToken;

        log(
          `message from ${event.origin}; source=${isExpectedFrame}; type=${event.data?.type}; token=${hasValidToken}`,
        );

        if (!isExpectedFrame || !isCloseMessage || !hasValidToken) {
          return;
        }

        closeLightbox();
      });

      openButton.addEventListener("click", openLightbox);
      openLightbox();
    </script>
  </body>
</html>
