<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Origin B - iframe content</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07111f;
        color: #f6fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 22px;
        background:
          linear-gradient(rgba(30, 120, 210, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(30, 120, 210, 0.18) 1px, transparent 1px),
          radial-gradient(circle at 70% 25%, rgba(65, 255, 164, 0.22), transparent 18rem),
          #07111f;
        background-size:
          32px 32px,
          32px 32px,
          auto,
          auto;
      }

      .panel {
        position: relative;
        width: min(760px, 100%);
        min-height: 360px;
        border: 2px solid #39c9ff;
        border-radius: 8px;
        padding: 52px 28px 28px;
        background: linear-gradient(145deg, rgba(18, 36, 78, 0.96), rgba(22, 9, 85, 0.94));
        box-shadow: inset 0 0 28px rgba(65, 214, 255, 0.24);
      }

      .tabs {
        position: absolute;
        top: 10px;
        left: 14px;
        right: 62px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .tab {
        border: 1px solid rgba(101, 232, 255, 0.8);
        border-radius: 6px;
        padding: 8px 6px;
        background: rgba(22, 50, 117, 0.85);
        color: #d7f7ff;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }

      .tab.active {
        background: #16d7df;
        color: #06112a;
      }

      .close {
        position: absolute;
        top: 8px;
        right: 10px;
        width: 42px;
        height: 42px;
        border: 2px solid #ffd8df;
        border-radius: 50%;
        background: #e61d48;
        color: #fff;
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 0 0 3px rgba(230, 29, 72, 0.35);
      }

      .close:hover {
        background: #ff3864;
      }

      h2 {
        margin: 0 0 18px;
        color: #56e7ff;
        text-align: center;
        font-size: 26px;
      }

      .content {
        max-width: 560px;
        margin: 0 auto;
        color: #dceaff;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font: 700 14px/1 system-ui;
        cursor: pointer;
      }

      code {
        color: #98ffd3;
      }
    </style>
  </head>
  <body>
    <section class="panel">
      <div class="tabs" aria-hidden="true">
        <div class="tab">Tab 1</div>
        <div class="tab">Tab 2</div>
        <div class="tab">Tab 3</div>
        <div class="tab active">Special</div>
        <div class="tab">Info</div>
      </div>

      <button id="closeButton" class="close" type="button" title="Close">x</button>

      <h2>Origin B iframe</h2>
      <div class="content">
        <p>
          This button cannot touch the parent DOM directly. It sends a
          <code>CLOSE_LIGHTBOX</code> message with the parent-provided token.
        </p>

        <div class="actions">
          <button id="badTokenButton" class="secondary" type="button">
            Send bad token
          </button>
          <button id="starTargetButton" class="secondary" type="button">
            Send with target "*"
          </button>
        </div>
      </div>
    </section>

    <script>
      const params = new URLSearchParams(window.location.search);
      const parentOrigin = params.get("parentOrigin");
      const closeToken = params.get("closeToken");

      function sendClose(token, targetOrigin) {
        window.parent.postMessage(
          {
            type: "CLOSE_LIGHTBOX",
            closeToken: token,
          },
          targetOrigin,
        );
      }

      document.querySelector("#closeButton").addEventListener("click", () => {
        sendClose(closeToken, parentOrigin);
      });

      document.querySelector("#badTokenButton").addEventListener("click", () => {
        sendClose("wrong-token", parentOrigin);
      });

      document.querySelector("#starTargetButton").addEventListener("click", () => {
        sendClose(closeToken, "*");
      });
    </script>
  </body>
</html>
